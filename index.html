<body>

<header>
  <div class="wrap">
    <div class="eyebrow"><span class="eyebrow-mark">●</span> YOUR PERSONAL SCREENING ROOM</div>
    <h1 class="serif marquee-title">My Watchlist Marquee</h1>
    <p class="sub">Everything you watch, plan, and finish — organised in one place.</p>
    <div class="stats" id="stats"></div>
    <div class="tabs" id="tabs"></div>
  </div>
</header>

<main>
  <div class="toolbar">
    <div class="filters" id="filters"></div>
    <div style="display:flex; gap:8px; align-items:center;">
      <button id="export-btn" class="icon-btn" title="Export data as a file">⬇ Export</button>
      <button id="import-btn" class="icon-btn" title="Import data from a file">⬆ Import</button>
      <input type="file" id="import-file-input" accept="application/json" class="hidden" />
      <button id="add-btn">＋ Add entry</button>
    </div>
  </div>
  <div id="grid-container"></div>

  <div class="external-links">
    <a class="external-link-btn" href="https://www.justwatch.com/us/streaming-charts?c=global" target="_blank" rel="noopener noreferrer">🎬 Movies Chart<span class="ext-icon">↗</span></a>
    <a class="external-link-btn" href="https://www.justwatch.com/us/streaming-charts?c=global&t=shows" target="_blank" rel="noopener noreferrer">📺 TV Show Chart<span class="ext-icon">↗</span></a>
    <a class="external-link-btn" href="https://www.justwatch.com/us/streaming-charts?c=global&t=seasons&ct=weekly" target="_blank" rel="noopener noreferrer">🗂 Seasons Chart<span class="ext-icon">↗</span></a>
  </div>

  <div style="text-align:center; margin-top:48px; padding-top:20px; border-top:1px solid var(--border); font-size:11px; color:var(--dark-star); letter-spacing:0.05em;">
    Concept &amp; build by AK · Aug 2026
  </div>
</main>

<div class="modal-overlay" id="modal-overlay">
  <form class="modal" id="entry-form">
    <button type="button" class="close-btn" id="close-modal">✕</button>
    <h2 class="serif" id="modal-title">New stub</h2>
    <div class="kind-label" id="modal-kind"></div>

    <label>Title</label>
    <input type="text" id="f-title" placeholder="e.g. The Bear" required />

    <label>Platform</label>
    <select id="f-platform" required></select>

    <!-- MOVIE-ONLY FIELDS -->
    <div id="movie-fields">
      <label>Year</label>
      <input type="number" id="f-year" placeholder="e.g. 2010" min="1900" max="2100" />
      <label>Status</label>
      <select id="f-status"></select>
    </div>

    <!-- SHOW-ONLY FIELDS -->
    <div id="show-fields">
      <div class="seasons-editor">
        <div class="seasons-editor-header">
          <span>Seasons</span>
          <button type="button" class="add-season-btn" id="add-season-btn">＋ Add season</button>
        </div>
        <div id="seasons-list"></div>
      </div>
    </div>

    <button type="submit" class="submit-btn" id="submit-btn">Add to watchlist</button>
  </form>
</div>

<script>
  var PLATFORMS = [
    { name: "Netflix", color: "#B4111B" },
    { name: "Prime Video", color: "#1FA8DB" },
    { name: "JioHotstar", color: "#1489D8" },
    { name: "Zee5", color: "#8B2635" },
    { name: "SonyLIV", color: "#E8B84B" },
    { name: "Apple TV+", color: "#F2EFE9" },
    { name: "YouTube", color: "#FF0000" },
    { name: "Lionsgate Play", color: "#D4A017" },
    { name: "BBC Player", color: "#5DA9C9" },
    { name: "Other", color: "#7A7A85" }
  ];

  var STATUS = {
    watching: { label: "Watching", color: "#35CDB7" },
    completed: { label: "Completed", color: "#B9F36A" },
    plan: { label: "Plan to Watch", color: "#8998B3" },
    dropped: { label: "Dropped", color: "#F07891" }
  };

  var STORAGE_KEY = "ott-tracker-entries-v2";
  var entries = [];
  var activeTab = "tv"; // 'tv' | 'movies'
  var filter = "all";
  var editingId = null;
  var formSeasons = []; // {uid, number, totalEpisodes, watchedEpisodes, upcomingDate}

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  // Formats a Date as a LOCAL calendar date "YYYY-MM-DD" — never use .toISOString()
  // for this, since that converts to UTC and silently shifts the date backward by
  // one day for any timezone ahead of UTC (e.g. India, UTC+5:30).
  function localDateStr(d) {
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var day = String(d.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + day;
  }

  function loadEntries() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      entries = raw ? JSON.parse(raw) : [];
    } catch (e) {
      entries = [];
    }
  }
  function saveEntries() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
    } catch (e) {
      alert("Couldn't save to this browser's storage.");
    }
  }

  function escapeHtml(str) {
    var div = document.createElement("div");
    div.innerText = str == null ? "" : str;
    return div.innerHTML;
  }

  function formatDateWithDay(dateStr) {
    if (!dateStr) return "";
    var d = new Date(dateStr + "T00:00:00");
    if (isNaN(d.getTime())) return dateStr;
    return d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
  }

  /* ---------- auto-advance upcoming episodes ---------- */
  function advanceDateByCadence(dateStr, cadence, customDays) {
    var d = new Date(dateStr + "T00:00:00");
    if (cadence === "daily") { d.setDate(d.getDate() + 1); return localDateStr(d); }
    if (cadence === "weekly") { d.setDate(d.getDate() + 7); return localDateStr(d); }
    if (cadence === "biweekly") { d.setDate(d.getDate() + 14); return localDateStr(d); }
    if (cadence === "monthly") { d.setMonth(d.getMonth() + 1); return localDateStr(d); }
    if (cadence === "custom" && customDays && customDays.length) {
      for (var i = 1; i <= 7; i++) {
        var candidate = new Date(d);
        candidate.setDate(candidate.getDate() + i);
        if (customDays.indexOf(candidate.getDay()) !== -1) {
          return localDateStr(candidate);
        }
      }
    }
    return null;
  }

  function computeNextCadenceDate(cadence, customDays) {
    var todayStr = localDateStr(new Date());
    return advanceDateByCadence(todayStr, cadence, customDays);
  }

  function advanceAllSeasons() {
    var todayStr = localDateStr(new Date());
    var changed = false;
    var MAX_CATCHUP_INCREMENTS = 52; // cap the number of "missed" episodes we'll add for a stale date
    var HARD_ITERATION_LIMIT = 20000; // pure safety valve against a genuine infinite loop
    entries.forEach(function (entry) {
      if (entry.type !== "show" || !entry.seasons) return;
      entry.seasons.forEach(function (season) {
        if (season.status === "dropped") return;
        if (!season.upcomingDate || !season.cadence || season.cadence === "none") return;
        var incrementsAdded = 0;
        var iterations = 0;
        // Always fully advance the date to the future, even if it started very stale —
        // but only bump totalEpisodes for a bounded number of "missed" releases,
        // so a corrupted/very-old date can't balloon the episode count.
        while (season.upcomingDate && season.upcomingDate <= todayStr && iterations < HARD_ITERATION_LIMIT) {
          // Work out the following date first: if the cadence can't produce one (e.g. "custom"
          // with no days picked) stop here, so the count never creeps up on every refresh.
          var next = advanceDateByCadence(season.upcomingDate, season.cadence, season.customDays);
          if (!next) break;
          if (incrementsAdded < MAX_CATCHUP_INCREMENTS) {
            season.totalEpisodes = String((Number(season.totalEpisodes) || 0) + 1);
            season.newEpisodeReleasedOn = season.upcomingDate;
            incrementsAdded++;
          }
          season.upcomingDate = next;
          changed = true;
          iterations++;
        }
      });
    });
    if (changed) saveEntries();
    return changed;
  }

  /* ---------- tabs ---------- */
  function renderTabs() {
    var el = document.getElementById("tabs");
    el.innerHTML =
      '<button class="tab' + (activeTab === "tv" ? " active" : "") + '" data-tab="tv">📺 TV Shows</button>' +
      '<button class="tab' + (activeTab === "movies" ? " active" : "") + '" data-tab="movies">🎬 Movies</button>';
    el.querySelectorAll(".tab").forEach(function (btn) {
      btn.addEventListener("click", function () {
        activeTab = btn.getAttribute("data-tab");
        filter = "all";
        renderAll();
      });
    });
  }

  /* ---------- filters ---------- */
  function renderFilters() {
    var el = document.getElementById("filters");
    var html = '<button class="chip' + (filter === "all" ? " active" : "") + '" data-filter="all" style="' +
      (filter === "all" ? "background:#E8B84B;color:#0E0E12;border-color:#E8B84B;" : "") + '">All</button>';
    Object.keys(STATUS).forEach(function (key) {
      var s = STATUS[key];
      var active = filter === key;
      html += '<button class="chip' + (active ? " active" : "") + '" data-filter="' + key + '" style="' +
        (active ? "background:" + s.color + ";" : "") + '">' + s.label + "</button>";
    });
    el.innerHTML = html;
    el.querySelectorAll(".chip").forEach(function (btn) {
      btn.addEventListener("click", function () {
        filter = btn.getAttribute("data-filter");
        renderAll();
      });
    });
  }

  /* ---------- stats ---------- */
  function renderStats() {
    var stats = {
      total: entries.length,
      watching: entries.filter(function (e) { return getEffectiveStatus(e) === "watching"; }).length,
      completed: entries.filter(function (e) { return getEffectiveStatus(e) === "completed"; }).length,
      movies: entries.filter(function (e) { return e.type === "movie"; }).length,
      shows: entries.filter(function (e) { return e.type === "show"; }).length
    };
    document.getElementById("stats").innerHTML =
      '<div><span class="num" style="color:var(--accent)">' + stats.total + '</span> <span class="grey">total</span></div>' +
      '<div><span class="num" style="color:var(--aqua)">' + stats.watching + '</span> <span class="grey">watching</span></div>' +
      '<div><span class="num" style="color:var(--accent)">' + stats.completed + '</span> <span class="grey">completed</span></div>' +
      '<div><span class="num">' + stats.movies + '</span> <span class="grey">movies</span></div>' +
      '<div><span class="num">' + stats.shows + '</span> <span class="grey">shows</span></div>';
  }

  /* ---------- grid ---------- */
  var STATUS_ORDER = { watching: 0, plan: 1, completed: 2, dropped: 3 };

  function getEffectiveStatus(entry) {
    if (entry.type === "movie") return entry.status;
    var allSeasons = entry.seasons || [];
    var seasons = allSeasons.filter(function (s) { return s.status !== "dropped"; });
    if (allSeasons.length && !seasons.length) return "dropped"; // every season dropped
    if (seasons.some(function (s) { return s.status === "watching"; })) return "watching";
    if (seasons.some(function (s) { return s.status === "plan"; })) return "plan";
    if (seasons.length && seasons.every(function (s) { return s.status === "completed"; })) return "completed";
    return "plan";
  }

  function entryMatchesFilter(entry, filterKey) {
    if (filterKey === "all") return true;
    if (entry.type === "movie") return entry.status === filterKey;
    if (filterKey === "dropped") return getEffectiveStatus(entry) === "dropped";
    return (entry.seasons || []).some(function (s) { return s.status === filterKey; });
  }

  function isCaughtUpWaiting(entry) {
    if (entry.type !== "show" || !entry.seasons || !entry.seasons.length) return false;
    var totalAll = 0, watchedAll = 0;
    entry.seasons.forEach(function (s) {
      totalAll += Number(s.totalEpisodes) || 0;
      watchedAll += Number(s.watchedEpisodes) || 0;
    });
    if (totalAll === 0 || watchedAll < totalAll) return false; // still has something unwatched
    var todayStr = localDateStr(new Date());
    return entry.seasons.some(function (s) {
      return s.upcomingDate && s.upcomingDate > todayStr && s.cadence && s.cadence !== "none";
    });
  }

  function isNewEpisodeVisible(season) {
    if (!season.newEpisodeReleasedOn) return false;
    var total = Number(season.totalEpisodes) || 0;
    var watched = Number(season.watchedEpisodes) || 0;
    if (total > 0 && watched >= total) return false; // caught up — nothing new to flag
    var released = new Date(season.newEpisodeReleasedOn + "T00:00:00");
    var today = new Date();
    today.setHours(0, 0, 0, 0);
    var diffDays = Math.round((today - released) / 86400000);
    return diffDays === 1; // visible only on the day after release — a single 24-hour window
  }

  function hasVisibleNewEpisode(entry) {
    if (entry.type !== "show" || !entry.seasons) return false;
    return entry.seasons.some(function (s) { return isNewEpisodeVisible(s); });
  }

  function getCurrentlyWatching(entry) {
    if (entry.type !== "show" || !entry.seasons) return null;
    var season = entry.seasons.filter(function (s) { return s.status === "watching"; })[0];
    if (!season) return null;
    var total = Number(season.totalEpisodes) || 0;
    var watched = Number(season.watchedEpisodes) || 0;
    if (total > 0 && watched >= total) {
      return { season: season.number, caughtUp: true };
    }
    return { season: season.number, episode: watched + 1 };
  }

  function getCompletionDate(entry) {
    if (entry.type === "movie") return entry.completedAt || null;
    return entry.lastWatchedAt ? entry.lastWatchedAt.slice(0, 10) : null;
  }

  var MONTH_NAMES = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

  function renderCompletedList(completedEntries) {
    var byMonth = {};
    completedEntries.forEach(function (entry) {
      var d = getCompletionDate(entry);
      var key = d ? d.slice(0, 7) : "unknown"; // "YYYY-MM"
      byMonth[key] = byMonth[key] || [];
      byMonth[key].push(entry);
    });

    var monthKeys = Object.keys(byMonth).filter(function (k) { return k !== "unknown"; }).sort().reverse();
    if (byMonth.unknown) monthKeys.push("unknown");

    var html = '<ul class="completed-list">';
    var lastYear = null;
    monthKeys.forEach(function (key) {
      var isUnknown = key === "unknown";
      var year = isUnknown ? null : key.slice(0, 4);
      var monthIdx = isUnknown ? null : parseInt(key.slice(5, 7), 10) - 1;

      if (!isUnknown && year !== lastYear) {
        html += '<li class="completed-year-heading">' + year + '</li>';
        lastYear = year;
      } else if (isUnknown && lastYear !== "unknown") {
        html += '<li class="completed-year-heading">Undated</li>';
        lastYear = "unknown";
      }
      if (!isUnknown) {
        html += '<li class="completed-month-heading">' + MONTH_NAMES[monthIdx] + '</li>';
      }

      var monthEntries = byMonth[key].slice().sort(function (a, b) {
        var da = getCompletionDate(a) || "";
        var db = getCompletionDate(b) || "";
        if (da !== db) return da < db ? 1 : -1;
        return a.title.localeCompare(b.title);
      });

      monthEntries.forEach(function (entry) {
        var platform = PLATFORMS.filter(function (p) { return p.name === entry.platform; })[0] || PLATFORMS[7];
        html += '<li class="completed-row">';
        html += '<span class="completed-row-icon">' + (entry.type === "movie" ? "🎬" : "📺") + '</span>';
        html += '<span class="completed-row-title">' + escapeHtml(entry.title) + (entry.type === "movie" && entry.year ? ' <span class="title-year">(' + escapeHtml(entry.year) + ')</span>' : '') + '</span>';
        html += '<span class="completed-row-platform" style="color:' + platform.color + '">' + escapeHtml(entry.platform) + '</span>';
        html += '<span class="completed-row-actions">';
        html += '<button type="button" class="link-btn" data-edit="' + entry.id + '">Edit</button>';
        html += '<button type="button" class="link-btn danger-hover" data-delete="' + entry.id + '" title="Delete">🗑</button>';
        html += '</span>';
        html += '</li>';
      });
    });
    html += '</ul>';
    return html;
  }

  function renderDroppedList(droppedEntries) {
    var sorted = droppedEntries.slice().sort(function (a, b) { return a.title.localeCompare(b.title); });
    var html = '<ul class="completed-list">';
    sorted.forEach(function (entry) {
      var platform = PLATFORMS.filter(function (p) { return p.name === entry.platform; })[0] || PLATFORMS[7];
      html += '<li class="completed-row">';
      html += '<span class="completed-row-icon">' + (entry.type === "movie" ? "🎬" : "📺") + '</span>';
      html += '<span class="completed-row-title">' + escapeHtml(entry.title) + (entry.type === "movie" && entry.year ? ' <span class="title-year">(' + escapeHtml(entry.year) + ')</span>' : '') + '</span>';
      html += '<span class="completed-row-platform" style="color:' + platform.color + '">' + escapeHtml(entry.platform) + '</span>';
      html += '<span class="completed-row-actions">';
      html += '<button type="button" class="link-btn" data-edit="' + entry.id + '">Edit</button>';
      html += '<button type="button" class="link-btn danger-hover" data-delete="' + entry.id + '" title="Delete">🗑</button>';
      html += '</span>';
      html += '</li>';
    });
    html += '</ul>';
    return html;
  }

  function renderGrid() {
    var container = document.getElementById("grid-container");
    var typeForTab = activeTab === "tv" ? "show" : "movie";
    var byTab = entries.filter(function (e) {
      if (e.type !== typeForTab) return false;
      return true;
    });
    var filtered = filter === "all" ? byTab : byTab.filter(function (e) { return entryMatchesFilter(e, filter); });
    filtered = filtered.slice().sort(function (a, b) {
      var sa = getEffectiveStatus(a), sb = getEffectiveStatus(b);
      var oa = STATUS_ORDER.hasOwnProperty(sa) ? STATUS_ORDER[sa] : 99;
      var ob = STATUS_ORDER.hasOwnProperty(sb) ? STATUS_ORDER[sb] : 99;
      if (oa !== ob) return oa - ob;
      // Newly released episodes are indicated by the flashing NEW badge only.
      // Keep card ordering stable; release status must not move entries.
      var wa = isCaughtUpWaiting(a) ? 1 : 0;
      var wb = isCaughtUpWaiting(b) ? 1 : 0;
      if (wa !== wb) return wa - wb; // caught-up-and-waiting sinks to the bottom of its category
      var da = a.lastWatchedAt || "";
      var db = b.lastWatchedAt || "";
      if (da !== db) return da < db ? 1 : -1; // most recently watched first
      return 0;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<div class="empty"><div class="big">🎟</div><p>' +
        (byTab.length === 0
          ? "No " + (activeTab === "tv" ? "shows" : "movies") + " tracked yet. Add the first one."
          : "Nothing here for this filter.") +
        "</p></div>";
      return;
    }

    // Completed items render as a compact, readable list grouped by year/month
    // instead of the small scaled-down stub cards.
    var stubEntries = filtered.filter(function (e) { var st = getEffectiveStatus(e); return st !== "completed" && st !== "dropped"; });
    var completedEntries = filtered.filter(function (e) { return getEffectiveStatus(e) === "completed"; });
    var droppedEntries = filtered.filter(function (e) { return getEffectiveStatus(e) === "dropped"; });

    var html = "";
    var currentGroupStatus = null;
    stubEntries.forEach(function (entry, idx) {
      var platform = PLATFORMS.filter(function (p) { return p.name === entry.platform; })[0] || PLATFORMS[7];
      var effStatus = getEffectiveStatus(entry);
      var status = STATUS[effStatus] || STATUS.plan;

      if (effStatus !== currentGroupStatus) {
        if (currentGroupStatus !== null) html += '</div></div>'; // close previous .grid + .status-section
        var groupCount = stubEntries.filter(function (e) { return getEffectiveStatus(e) === effStatus; }).length;
        html += '<div class="status-section">';
        html += '<div class="status-heading"><span class="dot" style="background:' + status.color + '"></span>' + status.label + ' <span class="count">(' + groupCount + ')</span></div>';
        html += '<div class="grid">';
        currentGroupStatus = effStatus;
      }

      html += '<div class="ticket-wrap" data-status="' + effStatus + '">';
      html += '<div class="ticket">';
      html += '<div class="ticket-top">';
      html += '<div class="ticket-top-left">';
      html += '<span class="serial-badge">#' + (idx + 1) + '</span>';
      html += '<span class="badge" style="background:' + platform.color + '22;color:' + platform.color + '">' + escapeHtml(entry.platform) + '</span>';
      html += '</div>';
      html += '<button type="button" class="delete-corner" data-delete="' + entry.id + '" title="Delete">🗑</button>';
      html += '</div>';
      html += '<h3 class="ticket-title serif">' + escapeHtml(entry.title) + (entry.type === "movie" && entry.year ? ' <span class="title-year">(' + escapeHtml(entry.year) + ')</span>' : '') + '</h3>';

      if (entry.type === "show") {
        var cw = getCurrentlyWatching(entry);
        if (cw) {
          var seasonLabel = cw.season ? "Season " + escapeHtml(cw.season) + (cw.caughtUp ? "" : ", ") : "";
          if (cw.caughtUp) {
            html += '<div class="currently-watching">▶ Caught up' + (seasonLabel ? " on " + seasonLabel : "") + ' — waiting for next episode</div>';
          } else {
            html += '<div class="currently-watching">▶ Watching: ' + seasonLabel + 'Episode ' + cw.episode + '</div>';
          }
        }
      }

      if (entry.type === "show" && entry.seasons && entry.seasons.length) {
        var totalAll = 0, watchedAll = 0;
        entry.seasons.forEach(function (s) {
          totalAll += Number(s.totalEpisodes) || 0;
          watchedAll += Number(s.watchedEpisodes) || 0;
        });
        // If no total is set yet but something has been watched, treat as fully caught up (100%)
        // rather than dividing by zero and showing 0%.
        var overallPct = totalAll ? Math.min(100, (watchedAll / totalAll) * 100) : (watchedAll > 0 ? 100 : 0);

        html += '<div class="overall-progress">';
        html += '<div class="progress-row"><span>Overall: ' + watchedAll + '/' + totalAll + ' episodes</span><span>' + Math.round(overallPct) + '%</span></div>';
        html += '<div class="combined-progress">';
        entry.seasons.forEach(function (s) {
          var segTotal = Number(s.totalEpisodes) || 0;
          var segWatched = Number(s.watchedEpisodes) || 0;
          var segCaughtUp = segTotal ? segWatched >= segTotal : segWatched > 0;
          var segPct = segTotal ? Math.min(100, (segWatched / segTotal) * 100) : (segWatched > 0 ? 100 : 0);
          var segColor = segCaughtUp ? "var(--success)" : "var(--gold-dark)";
          html += '<div class="combined-progress-seg" title="Season ' + escapeHtml(s.number) + ': ' + segWatched + '/' + segTotal + '">';
          html += '<div class="combined-progress-fill" style="width:' + segPct + '%;background:' + segColor + '"></div>';
          html += '</div>';
        });
        html += '</div>';
        html += '</div>';

        html += '<div class="season-chip-row">';
        entry.seasons.forEach(function (s, sIdx) {
          var total = Number(s.totalEpisodes) || 0;
          var watched = Number(s.watchedEpisodes) || 0;
          var sStatus = STATUS[s.status] || STATUS.plan;
          var isWatching = s.status === "watching";
          var isNew = isNewEpisodeVisible(s);
          var chipClass = "season-chip" + (isWatching ? " season-chip-active" : "") + (isNew ? " season-chip-new" : "");
          var chipStyle = isWatching
            ? "border-color:" + sStatus.color + ";background:" + sStatus.color + "26;"
            : "border-color:" + sStatus.color + "55;";
          html += '<div class="' + chipClass + '" style="' + chipStyle + '">';
          if (isNew) html += '<span class="new-badge">NEW</span>';
          if (isWatching) html += '<span class="watching-dot" style="background:' + sStatus.color + '"></span>';
          html += '<button type="button" class="mini-btn" data-card-ep-minus="' + entry.id + '" data-season-idx="' + sIdx + '"' + (watched <= 0 ? ' disabled' : '') + ' title="Unwatch episode">–</button>';
          html += '<span' + (isWatching ? ' style="font-weight:700;color:var(--text);"' : '') + '>' + (s.number ? "S" + escapeHtml(s.number) + " · " : "") + watched + '/' + total + '</span>';
          html += '<button type="button" class="mini-btn" data-card-ep-plus="' + entry.id + '" data-season-idx="' + sIdx + '"' + (total && watched >= total ? ' disabled' : '') + ' title="Mark episode watched">+</button>';
          html += '</div>';
        });
        html += '</div>';

        var soonest = null;
        entry.seasons.forEach(function (s) {
          if (s.status !== "dropped" && s.upcomingDate && (!soonest || s.upcomingDate < soonest.upcomingDate)) soonest = s;
        });
        if (soonest) {
          var watchedEpisodes = Number(soonest.watchedEpisodes) || 0;
          var nextEpisode = (Number(soonest.totalEpisodes) || 0) + 1;
          var nextDate = new Date(soonest.upcomingDate + "T00:00:00");
          var upcomingDateLabel = isNaN(nextDate.getTime()) ? escapeHtml(soonest.upcomingDate) :
            escapeHtml(nextDate.toLocaleDateString("en-US", { month: "short", day: "numeric" }));
          var episodeLabel = (soonest.number ? 'S' + escapeHtml(soonest.number) + ' ' : '') + 'E' + nextEpisode;
          html += '<div class="season-next">Next: ' + upcomingDateLabel + ' · ' + episodeLabel + '</div>';
        }
      }

      html += '<div class="card-footer">';
      if (entry.type === "movie") {
        html += '<span class="badge" style="background:' + status.color + '22;color:' + status.color + '">' + status.label + '</span>';
      } else {
        html += '<span></span>';
      }
      html += '<button type="button" class="link-btn" data-edit="' + entry.id + '">Edit</button>';
      html += '</div>';
      html += '</div>'; // close .ticket
      html += '</div>'; // close .ticket-wrap
    });
    if (currentGroupStatus !== null) html += '</div></div>'; // close last .grid + .status-section

    if (completedEntries.length) {
      var completedStatus = STATUS.completed;
      html += '<div class="status-section">';
      html += '<div class="status-heading"><span class="dot" style="background:' + completedStatus.color + '"></span>' + completedStatus.label + ' <span class="count">(' + completedEntries.length + ')</span></div>';
      html += renderCompletedList(completedEntries);
      html += '</div>';
    }

    if (droppedEntries.length) {
      var droppedStatus = STATUS.dropped;
      html += '<div class="status-section">';
      html += '<div class="status-heading"><span class="dot" style="background:' + droppedStatus.color + '"></span>' + droppedStatus.label + ' <span class="count">(' + droppedEntries.length + ')</span></div>';
      html += renderDroppedList(droppedEntries);
      html += '</div>';
    }

    container.innerHTML = html;
    applyStubScaling();

    container.querySelectorAll("[data-edit]").forEach(function (btn) {
      btn.addEventListener("click", function () { openModal(btn.getAttribute("data-edit")); });
    });
    container.querySelectorAll("[data-delete]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-delete");
        if (!confirm("Delete this entry?")) return;
        entries = entries.filter(function (e) { return e.id !== id; });
        saveEntries();
        renderAll();
      });
    });
    container.querySelectorAll("[data-card-ep-plus]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        adjustSeasonWatched(btn.getAttribute("data-card-ep-plus"), Number(btn.getAttribute("data-season-idx")), 1);
      });
    });
    container.querySelectorAll("[data-card-ep-minus]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        adjustSeasonWatched(btn.getAttribute("data-card-ep-minus"), Number(btn.getAttribute("data-season-idx")), -1);
      });
    });
  }

  function maybeAutoComplete(season) {
    var total = Number(season.totalEpisodes) || 0;
    var watched = Number(season.watchedEpisodes) || 0;
    if ((!season.cadence || season.cadence === "none") && total > 0 && watched >= total) {
      season.status = "completed";
    }
  }

  function maybeAutoStart(season, prevWatched, nextWatched) {
    if (prevWatched === 0 && nextWatched > 0 && season.status !== "completed" && season.status !== "dropped") {
      if (season.status !== "watching") {
        season.prevStatus = season.status;
      }
      season.status = "watching";
    }
  }

  function maybeAutoRevert(season, prevWatched, nextWatched) {
    if (nextWatched === 0 && prevWatched > 0 && season.status === "watching" && season.prevStatus) {
      season.status = season.prevStatus;
      delete season.prevStatus;
    }
  }

  function adjustSeasonWatched(entryId, seasonIdx, delta) {
    var entry = entries.filter(function (e) { return e.id === entryId; })[0];
    if (!entry || !entry.seasons || !entry.seasons[seasonIdx]) return;
    var season = entry.seasons[seasonIdx];
    var total = Number(season.totalEpisodes) || 0;
    var current = Number(season.watchedEpisodes) || 0;
    var next = current + delta;
    if (next < 0) next = 0;
    if (total && next > total) next = total;
    season.watchedEpisodes = String(next);
    maybeAutoStart(season, current, next);
    maybeAutoRevert(season, current, next);
    maybeAutoComplete(season);
    if (delta > 0) {
      entry.lastWatchedAt = new Date().toISOString();
    }
    saveEntries();
    renderGrid();
  }

  var STATUS_SCALE = {
    watching: 1,
    completed: 0.5,
    dropped: 0.25,
    plan: 0.75
  };

  function applyStubScaling() {
    document.querySelectorAll(".ticket-wrap").forEach(function (wrap) {
      var status = wrap.getAttribute("data-status");
      var scale = STATUS_SCALE.hasOwnProperty(status) ? STATUS_SCALE[status] : 1;
      var ticket = wrap.querySelector(".ticket");
      if (!ticket) return;
      ticket.style.transform = "none";
      var naturalWidth = ticket.offsetWidth;
      var naturalHeight = ticket.offsetHeight;
      wrap.style.width = (naturalWidth * scale) + "px";
      wrap.style.height = (naturalHeight * scale) + "px";
      ticket.style.transformOrigin = "top left";
      ticket.style.transform = "scale(" + scale + ")";
    });
  }

  var lastRenderedDay = "";

  function renderAll() {
    lastRenderedDay = localDateStr(new Date());
    renderTabs();
    renderFilters();
    renderStats();
    renderGrid();
  }

  /* ---------- modal: seasons editor ---------- */
  function renderSeasonsList() {
    var el = document.getElementById("seasons-list");
    if (formSeasons.length === 0) {
      el.innerHTML = '<p style="font-size:12px;color:#7A7A85;margin:0 0 4px;">No seasons added yet.</p>';
      return;
    }
    var html = "";
    formSeasons.forEach(function (s, idx) {
      html += '<div class="season-block" data-suid="' + s.uid + '">';
      html += '<div class="season-block-header"><b>Season</b><button type="button" class="remove-season-btn" data-remove-season="' + s.uid + '">Remove</button></div>';
      html += '<label>Season number</label>';
      html += '<input type="text" data-field="number" data-suid="' + s.uid + '" value="' + escapeHtml(s.number) + '" placeholder="e.g. 1" />';
      html += '<label>Status</label>';
      html += '<select data-field="status" data-suid="' + s.uid + '">';
      Object.keys(STATUS).forEach(function (key) {
        html += '<option value="' + key + '"' + (s.status === key ? " selected" : "") + '>' + STATUS[key].label + '</option>';
      });
      html += '</select>';
      html += '<label>Total episodes</label>';
      html += '<input type="number" min="0" data-field="totalEpisodes" data-suid="' + s.uid + '" value="' + escapeHtml(s.totalEpisodes) + '" placeholder="e.g. 10" />';
      html += '<label>Episodes watched</label>';
      html += '<div class="ep-counter">';
      html += '<button type="button" class="round-btn" data-ep-minus="' + s.uid + '">–</button>';
      html += '<input type="number" min="0" data-field="watchedEpisodes" data-suid="' + s.uid + '" value="' + escapeHtml(s.watchedEpisodes) + '" />';
      html += '<button type="button" class="round-btn" data-ep-plus="' + s.uid + '">+</button>';
      html += '</div>';
      html += '<label>Upcoming episode date</label>';
      html += '<input type="date" data-field="upcomingDate" data-suid="' + s.uid + '" value="' + escapeHtml(s.upcomingDate) + '" />';
      html += '<button type="button" class="clear-date-btn" data-clear-date="' + s.uid + '"' + (s.upcomingDate ? '' : ' disabled') + '>✕ Clear date</button>';
      html += '<label>Release cadence</label>';
      html += '<select data-field="cadence" data-suid="' + s.uid + '">';
      ["none", "daily", "weekly", "biweekly", "monthly", "custom"].forEach(function (c) {
        var labels = { none: "One-off / not sure", daily: "Daily", weekly: "Weekly", biweekly: "Every 2 weeks", monthly: "Monthly", custom: "Custom (pick days)" };
        html += '<option value="' + c + '"' + (s.cadence === c ? " selected" : "") + '>' + labels[c] + '</option>';
      });
      html += '</select>';
      if (s.cadence === "custom") {
        var dayNames = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
        var selectedDays = s.customDays || [];
        html += '<label>Release days</label>';
        html += '<div class="day-picker">';
        dayNames.forEach(function (dn, di) {
          var active = selectedDays.indexOf(di) !== -1;
          html += '<button type="button" class="day-chip' + (active ? " active" : "") + '" data-toggle-day="' + di + '" data-suid="' + s.uid + '">' + dn + '</button>';
        });
        html += '</div>';
      }
      html += '</div>';
    });
    el.innerHTML = html;

    el.querySelectorAll("[data-clear-date]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var suid = btn.getAttribute("data-clear-date");
        var season = formSeasons.filter(function (s) { return s.uid === suid; })[0];
        if (!season) return;
        season.upcomingDate = "";
        renderSeasonsList();
      });
    });

    el.querySelectorAll("[data-toggle-day]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var suid = btn.getAttribute("data-suid");
        var day = Number(btn.getAttribute("data-toggle-day"));
        var season = formSeasons.filter(function (s) { return s.uid === suid; })[0];
        if (!season) return;
        season.customDays = season.customDays || [];
        var idx = season.customDays.indexOf(day);
        if (idx === -1) season.customDays.push(day);
        else season.customDays.splice(idx, 1);
        if (season.customDays.length) {
          var autoDate = computeNextCadenceDate("custom", season.customDays);
          if (autoDate) season.upcomingDate = autoDate;
        }
        renderSeasonsList();
      });
    });

    el.querySelectorAll("[data-field]").forEach(function (input) {
      input.addEventListener("input", function () {
        var suid = input.getAttribute("data-suid");
        var field = input.getAttribute("data-field");
        var season = formSeasons.filter(function (s) { return s.uid === suid; })[0];
        if (season) {
          if (field === "watchedEpisodes") {
            var prev = Number(season.watchedEpisodes) || 0;
            var next = Number(input.value) || 0;
            season[field] = input.value;
            maybeAutoStart(season, prev, next);
            maybeAutoRevert(season, prev, next);
          } else {
            season[field] = input.value;
            if (field === "upcomingDate") {
              var clearBtn = el.querySelector('[data-clear-date="' + suid + '"]');
              if (clearBtn) clearBtn.disabled = !input.value;
            }
          }
          if (field === "totalEpisodes" || field === "watchedEpisodes" || field === "cadence") {
            maybeAutoComplete(season);
          }
          if (field === "cadence") {
            if (season.cadence && season.cadence !== "none" && season.cadence !== "custom") {
              var autoDate = computeNextCadenceDate(season.cadence, season.customDays);
              if (autoDate) season.upcomingDate = autoDate;
            }
            renderSeasonsList();
          }
        }
      });
    });
    el.querySelectorAll("[data-remove-season]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var suid = btn.getAttribute("data-remove-season");
        formSeasons = formSeasons.filter(function (s) { return s.uid !== suid; });
        renderSeasonsList();
      });
    });
    el.querySelectorAll("[data-ep-minus]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var suid = btn.getAttribute("data-ep-minus");
        var season = formSeasons.filter(function (s) { return s.uid === suid; })[0];
        if (season) {
          var prev = Number(season.watchedEpisodes) || 0;
          var next = Math.max(0, prev - 1);
          season.watchedEpisodes = String(next);
          maybeAutoRevert(season, prev, next);
          renderSeasonsList();
        }
      });
    });
    el.querySelectorAll("[data-ep-plus]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var suid = btn.getAttribute("data-ep-plus");
        var season = formSeasons.filter(function (s) { return s.uid === suid; })[0];
        if (season) {
          var total = Number(season.totalEpisodes);
          var prev = Number(season.watchedEpisodes) || 0;
          var next = prev + 1;
          season.watchedEpisodes = String(total ? Math.min(total, next) : next);
          maybeAutoStart(season, prev, Number(season.watchedEpisodes));
          maybeAutoComplete(season);
          renderSeasonsList();
        }
      });
    });
  }

  function addSeason() {
    var nextNumber = formSeasons.length + 1;
    formSeasons.push({ uid: uid(), number: String(nextNumber), status: "plan", totalEpisodes: "", watchedEpisodes: "", upcomingDate: "", cadence: "none" });
    renderSeasonsList();
  }

  function populateSelects() {
    var platformSel = document.getElementById("f-platform");
    platformSel.innerHTML = '<option value="">Select platform</option>' +
      PLATFORMS.map(function (p) { return '<option value="' + p.name + '">' + p.name + '</option>'; }).join("");
    var statusSel = document.getElementById("f-status");
    statusSel.innerHTML = Object.keys(STATUS).map(function (key) { return '<option value="' + key + '">' + STATUS[key].label + '</option>'; }).join("");
  }

  /* ---------- modal open/close/submit ---------- */
  function openModal(id) {
    editingId = id || null;
    var entry = id ? entries.filter(function (e) { return e.id === id; })[0] : null;
    var kind = entry ? entry.type : (activeTab === "tv" ? "show" : "movie");

    document.getElementById("modal-title").innerText = entry ? "Edit stub" : "New stub";
    document.getElementById("modal-kind").innerText = kind === "show" ? "TV Show" : "Movie";
    document.getElementById("submit-btn").innerText = entry ? "Save changes" : "Add to watchlist";

    document.getElementById("f-title").value = entry ? entry.title : "";
    document.getElementById("f-platform").value = entry ? entry.platform : "";
    document.getElementById("f-status").value = entry ? entry.status : "plan";
    document.getElementById("f-year").value = entry && entry.year ? entry.year : "";

    document.getElementById("movie-fields").classList.toggle("hidden", kind !== "movie");
    document.getElementById("show-fields").classList.toggle("hidden", kind !== "show");
    document.getElementById("entry-form").setAttribute("data-kind", kind);

    if (kind === "movie") {
      // no additional fields to initialize for movies right now
    } else {
      formSeasons = entry && entry.seasons ? entry.seasons.map(function (s) {
        return { uid: uid(), number: s.number, status: s.status || "watching", prevStatus: s.prevStatus, totalEpisodes: s.totalEpisodes, watchedEpisodes: s.watchedEpisodes, upcomingDate: s.upcomingDate, cadence: s.cadence || "none", customDays: s.customDays || [], newEpisodeReleasedOn: s.newEpisodeReleasedOn || null };
      }) : [];
      if (formSeasons.length === 0) addSeason();
      renderSeasonsList();
    }

    document.getElementById("modal-overlay").classList.add("open");
  }

  function closeModal() {
    document.getElementById("modal-overlay").classList.remove("open");
    editingId = null;
  }

  function submitForm(e) {
    e.preventDefault();
    var title = document.getElementById("f-title").value.trim();
    if (!title) return;
    var kind = document.getElementById("entry-form").getAttribute("data-kind");

    var data = {
      id: editingId || uid(),
      type: kind,
      title: title,
      platform: document.getElementById("f-platform").value
    };

    if (kind === "movie") {
      data.status = document.getElementById("f-status").value;
      data.year = document.getElementById("f-year").value ? document.getElementById("f-year").value : "";

      var oldMovie = editingId ? entries.filter(function (e2) { return e2.id === editingId; })[0] : null;
      var wasCompleted = oldMovie && oldMovie.status === "completed";
      if (data.status === "completed" && !wasCompleted) {
        data.completedAt = localDateStr(new Date());
      } else if (oldMovie && oldMovie.completedAt) {
        data.completedAt = oldMovie.completedAt;
      }
    } else {
      data.seasons = formSeasons
        .map(function (s) {
          return {
            number: s.number,
            status: s.status || "watching",
            prevStatus: s.prevStatus,
            totalEpisodes: s.totalEpisodes,
            watchedEpisodes: s.watchedEpisodes,
            upcomingDate: s.upcomingDate,
            cadence: s.cadence || "none",
            customDays: s.customDays || [],
            newEpisodeReleasedOn: s.newEpisodeReleasedOn || null
          };
        });
    }

    if (kind === "show") {
      var oldEntry = editingId ? entries.filter(function (e2) { return e2.id === editingId; })[0] : null;
      var oldWatchedSum = oldEntry && oldEntry.seasons ? oldEntry.seasons.reduce(function (sum, s) { return sum + (Number(s.watchedEpisodes) || 0); }, 0) : 0;
      var newWatchedSum = data.seasons.reduce(function (sum, s) { return sum + (Number(s.watchedEpisodes) || 0); }, 0);
      var watchDiff = newWatchedSum - oldWatchedSum;
      if (watchDiff > 0) {
        data.lastWatchedAt = new Date().toISOString();
      } else if (watchDiff < 0) {
        if (oldEntry) data.lastWatchedAt = oldEntry.lastWatchedAt;
      } else if (oldEntry) {
        data.lastWatchedAt = oldEntry.lastWatchedAt;
      }
    }

    if (editingId) {
      entries = entries.map(function (e2) { return e2.id === editingId ? data : e2; });
    } else {
      entries.unshift(data);
    }
    saveEntries();
    closeModal();
    renderAll();
  }

  /* ---------- init ---------- */
  document.addEventListener("DOMContentLoaded", function () {
    loadEntries();
    advanceAllSeasons();
    populateSelects();
    renderAll();

    // A phone keeps this page alive in the background for days without reloading it, so
    // re-check release dates whenever it comes back to the screen or the day rolls over.
    function refreshIfDue() {
      var overlay = document.getElementById("modal-overlay");
      if (overlay && overlay.classList.contains("open")) return; // don't disturb an open form
      var advanced = advanceAllSeasons();
      if (advanced || localDateStr(new Date()) !== lastRenderedDay) renderAll();
    }
    document.addEventListener("visibilitychange", function () { if (!document.hidden) refreshIfDue(); });
    window.addEventListener("focus", refreshIfDue);
    window.addEventListener("pageshow", function (e) { if (e.persisted) refreshIfDue(); });
    setInterval(refreshIfDue, 60000);

    document.getElementById("add-btn").addEventListener("click", function () { openModal(null); });
    document.getElementById("close-modal").addEventListener("click", closeModal);
    document.getElementById("modal-overlay").addEventListener("click", function (e) { if (e.target === this) closeModal(); });
    document.getElementById("entry-form").addEventListener("submit", submitForm);
    document.getElementById("add-season-btn").addEventListener("click", addSeason);

    document.getElementById("export-btn").addEventListener("click", exportData);
    document.getElementById("import-btn").addEventListener("click", function () {
      document.getElementById("import-file-input").click();
    });
    document.getElementById("import-file-input").addEventListener("change", importData);

    var resizeTimer;
    window.addEventListener("resize", function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(applyStubScaling, 150);
    });
  });

  /* ---------- export / import (manual cross-device sync) ---------- */
  function exportData() {
    var payload = {
      exportedAt: new Date().toISOString(),
      entries: entries
    };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    var stamp = localDateStr(new Date());
    a.href = url;
    a.download = "watchlist-backup-" + stamp + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function importData(e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function (evt) {
      try {
        var parsed = JSON.parse(evt.target.result);
        var incoming = Array.isArray(parsed) ? parsed : parsed.entries;
        if (!Array.isArray(incoming)) throw new Error("Not a valid backup file.");

        var mode = confirm(
          "Import " + incoming.length + " entries.\n\nClick OK to MERGE with your current list (recommended),\nor Cancel to REPLACE your current list entirely."
        );

        if (mode) {
          // merge: incoming entries win on id collision, keep everything else
          var existingIds = {};
          entries.forEach(function (en) { existingIds[en.id] = true; });
          var merged = entries.filter(function (en) {
            return !incoming.some(function (inc) { return inc.id === en.id; });
          });
          entries = merged.concat(incoming);
        } else {
          entries = incoming;
        }
        saveEntries();
        renderAll();
        alert("Import complete. " + entries.length + " entries total.");
      } catch (err) {
        alert("Couldn't read that file — make sure it's a JSON backup exported from this tracker.");
      }
      e.target.value = "";
    };
    reader.readAsText(file);
  }

  console.log("%cMy Watchlist Marquee — concept & build by AK (Aug 13, 2026)", "color:#E8B84B; font-weight:bold;");
</script>
