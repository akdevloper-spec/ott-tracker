<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Watchlist Marquee</title>
<style>
  :root {
    --bg: #0E0E12;
    --card: #17171D;
    --border: #2A2A33;
    --gold: #E8B84B;
    --teal: #2C5F5A;
    --red: #8B2635;
    --grey: #7A7A85;
    --grey-light: #9A9AA5;
    --text: #F2EFE9;
    --dark-star: #3A3A45;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  .serif { font-family: Georgia, "Times New Roman", serif; }
  @keyframes flicker {
    0%, 100% { opacity: 1; }
    92% { opacity: 1; }
    93% { opacity: 0.6; }
    94% { opacity: 1; }
  }
  .marquee-title { animation: flicker 6s infinite; }

  header { border-bottom: 1px solid var(--border); padding: 32px 24px; }
  .wrap { max-width: 980px; margin: 0 auto; }
  .eyebrow { display: flex; align-items: center; gap: 10px; color: var(--gold); font-size: 12px; letter-spacing: 0.3em; text-transform: uppercase; }
  .eyebrow .grey { color: var(--grey); }
  h1 { margin: 8px 0 0; font-size: 40px; letter-spacing: -0.02em; }
  header p.sub { color: var(--grey); margin: 8px 0 0; font-size: 15px; }
  .stats { display: flex; flex-wrap: wrap; gap: 24px; margin-top: 24px; font-size: 14px; }
  .stats .num { font-size: 20px; font-family: Georgia, serif; }
  .stats .grey { color: var(--grey); }

  /* Tabs */
  .tabs { display: flex; gap: 4px; margin-top: 28px; border-bottom: 1px solid var(--border); }
  .tab {
    background: none; border: none; color: var(--grey); font-size: 14px; padding: 10px 4px;
    margin-right: 24px; cursor: pointer; position: relative; text-transform: uppercase;
    letter-spacing: 0.08em; font-weight: 600;
  }
  .tab.active { color: var(--gold); }
  .tab.active::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--gold);
  }

  main { max-width: 980px; margin: 0 auto; padding: 32px 24px; }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 6px 14px; border-radius: 999px; font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.05em; border: 1px solid var(--border); background: transparent; color: var(--grey);
    cursor: pointer; transition: border-color .15s;
  }
  .chip:hover { border-color: var(--gold); }
  .chip.active { color: var(--bg); border-color: transparent; }
  #add-btn {
    display: flex; align-items: center; gap: 8px; background: var(--gold); color: var(--bg);
    border: none; padding: 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  #add-btn:hover { filter: brightness(1.1); }
  .icon-btn {
    background: transparent; color: var(--grey); border: 1px solid var(--border);
    padding: 9px 14px; border-radius: 999px; font-size: 13px; cursor: pointer;
  }
  .icon-btn:hover { border-color: var(--gold); color: var(--gold); }

  .empty { text-align: center; padding: 80px 20px; border: 1px dashed var(--border); border-radius: 12px; color: var(--grey); }
  .empty .big { font-size: 36px; opacity: .4; }

  .status-section { margin-bottom: 36px; }
  .status-section:last-child { margin-bottom: 0; }
  .status-heading {
    display: flex; align-items: center; gap: 10px; margin: 0 0 16px;
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--grey);
  }
  .status-heading .dot { width: 8px; height: 8px; border-radius: 999px; flex-shrink: 0; }
  .status-heading .count { color: var(--dark-star); }

  .grid { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }

  .ticket-wrap { flex: 0 0 auto; overflow: hidden; }
  .ticket {
    position: relative; background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 20px; width: min(440px, 86vw); overflow: hidden;
  }
  .ticket-top { display: flex; align-items: center; justify-content: space-between; }
  .badge { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; padding: 2px 8px; border-radius: 999px; }
  .delete-corner {
    background: none; border: none; color: var(--dark-star); cursor: pointer; font-size: 14px; padding: 2px;
  }
  .delete-corner:hover { color: var(--red); }
  .ticket-title { margin: 12px 0 0; font-size: 20px; line-height: 1.3; }
  .ticket-sub { font-size: 12px; color: var(--grey); margin: 4px 0 0; }

  .overall-progress { margin-top: 10px; }
  .progress-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--grey-light); margin-bottom: 4px; }
  .progress-bar { height: 6px; width: 100%; background: var(--bg); border-radius: 999px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--gold); border-radius: 999px; }

  .season-list { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 10px; }
  .season-row { margin-bottom: 10px; }
  .season-row:last-child { margin-bottom: 0; }
  .season-row .progress-row { font-size: 11px; }
  .season-row .progress-bar { height: 4px; }
  .season-next { margin-top: 3px; font-size: 11px; color: var(--teal); }
  .season-counter { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .card-round-btn {
    width: 22px; height: 22px; border-radius: 999px; border: 1px solid var(--border);
    background: transparent; color: var(--text); cursor: pointer; font-size: 13px; line-height: 1;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .card-round-btn:hover { border-color: var(--gold); }
  .card-round-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .card-round-btn:disabled:hover { border-color: var(--border); }
  .season-counter .count-label { font-size: 11px; color: var(--grey-light); min-width: 0; }

  .stars { margin-top: 12px; display: flex; gap: 2px; }
  .stars .star { font-size: 14px; color: var(--dark-star); }
  .stars .star.filled { color: var(--gold); }
  .notes { margin-top: 12px; font-size: 13px; color: var(--grey-light); }

  .card-footer { margin-top: 16px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--border); padding-top: 12px; }
  .link-btn { background: none; border: none; color: var(--grey); font-size: 12px; cursor: pointer; padding: 0; }
  .link-btn:hover { color: var(--gold); }
  .date-tag { font-size: 11px; color: var(--dark-star); }

  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    align-items: center; justify-content: center; padding: 16px; z-index: 50;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    width: 100%; max-width: 440px; padding: 24px; position: relative; max-height: 90vh; overflow-y: auto;
  }
  .modal h2 { margin: 0 0 4px; font-size: 20px; }
  .modal .kind-label { font-size: 11px; color: var(--gold); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 16px; }
  .close-btn { position: absolute; top: 16px; right: 16px; background: none; border: none; color: var(--grey); font-size: 16px; cursor: pointer; }
  .close-btn:hover { color: var(--text); }
  label { display: block; font-size: 11px; color: var(--grey); margin-bottom: 4px; }
  input, select, textarea {
    width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
    padding: 8px 10px; font-size: 14px; color: var(--text); margin-bottom: 12px; font-family: inherit;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--gold); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .seasons-editor { border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
  .seasons-editor-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .seasons-editor-header span { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--grey); }
  .add-season-btn { background: none; border: 1px dashed var(--border); color: var(--gold); border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
  .add-season-btn:hover { border-color: var(--gold); }
  .season-block { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-bottom: 10px; }
  .season-block:last-child { margin-bottom: 0; }
  .season-block-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .season-block-header b { font-size: 13px; }
  .remove-season-btn { background: none; border: none; color: var(--grey); font-size: 12px; cursor: pointer; }
  .remove-season-btn:hover { color: var(--red); }
  .season-block input { margin-bottom: 8px; }
  .ep-counter { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .ep-counter input { width: 60px; text-align: center; margin-bottom: 0; }
  .round-btn {
    width: 28px; height: 28px; border-radius: 999px; border: 1px solid var(--border);
    background: transparent; color: var(--text); cursor: pointer; font-size: 15px; line-height: 1;
  }
  .round-btn:hover { border-color: var(--gold); }

  .rating-input { display: flex; gap: 4px; margin-bottom: 12px; }
  .rating-input .star { font-size: 22px; color: var(--dark-star); cursor: pointer; }
  .rating-input .star.filled { color: var(--gold); }
  .submit-btn {
    width: 100%; background: var(--gold); color: var(--bg); border: none; border-radius: 999px;
    padding: 10px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 4px;
  }
  .submit-btn:hover { filter: brightness(1.1); }
  .hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="eyebrow">🎬 <span class="grey">Now Tracking</span></div>
    <h1 class="serif marquee-title">My Watchlist Marquee</h1>
    <p class="sub">Every movie and season you've caught on OTT, filed like a ticket stub.</p>
    <div class="stats" id="stats"></div>
    <div class="tabs" id="tabs"></div>
  </div>
</header>

<main>
  <div class="toolbar">
    <div class="filters" id="filters"></div>
    <div style="display:flex; gap:8px; align-items:center;">
      <button id="export-btn" class="icon-btn" title="Export data as a file">⬇ Export</button>
      <button id="import-btn" class="icon-btn" title="Import data from a file">⬆ Import</button>
      <input type="file" id="import-file-input" accept="application/json" class="hidden" />
      <button id="add-btn">＋ Add entry</button>
    </div>
  </div>
  <div id="grid-container"></div>
</main>

<div class="modal-overlay" id="modal-overlay">
  <form class="modal" id="entry-form">
    <button type="button" class="close-btn" id="close-modal">✕</button>
    <h2 class="serif" id="modal-title">New stub</h2>
    <div class="kind-label" id="modal-kind"></div>

    <label>Title</label>
    <input type="text" id="f-title" placeholder="e.g. The Bear" required />

    <label>Platform</label>
    <select id="f-platform"></select>

    <!-- MOVIE-ONLY FIELDS -->
    <div id="movie-fields">
      <label>Status</label>
      <select id="f-status"></select>
      <label>Rating</label>
      <div class="rating-input" id="movie-rating-input"></div>
    </div>

    <!-- SHOW-ONLY FIELDS -->
    <div id="show-fields">
      <div class="seasons-editor">
        <div class="seasons-editor-header">
          <span>Seasons</span>
          <button type="button" class="add-season-btn" id="add-season-btn">＋ Add season</button>
        </div>
        <div id="seasons-list"></div>
      </div>
      <label>Overall rating</label>
      <div class="rating-input" id="show-rating-input"></div>
    </div>

    <label>Date started/watched</label>
    <input type="date" id="f-date-watched" />

    <label>Notes</label>
    <textarea id="f-notes" rows="2" placeholder="Optional thoughts..."></textarea>

    <button type="submit" class="submit-btn" id="submit-btn">Add to watchlist</button>
  </form>
</div>

<script>
  var PLATFORMS = [
    { name: "Netflix", color: "#B4111B" },
    { name: "Prime Video", color: "#1FA8DB" },
    { name: "Disney+ Hotstar", color: "#1489D8" },
    { name: "JioCinema", color: "#8B2FD4" },
    { name: "Zee5", color: "#8B2635" },
    { name: "SonyLIV", color: "#E8B84B" },
    { name: "Apple TV+", color: "#F2EFE9" },
    { name: "YouTube", color: "#FF0000" },
    { name: "Lionsgate Play", color: "#D4A017" },
    { name: "BBC Player", color: "#5DA9C9" },
    { name: "Other", color: "#7A7A85" }
  ];

  var STATUS = {
    watching: { label: "Watching", color: "#2C5F5A" },
    completed: { label: "Completed", color: "#E8B84B" },
    plan: { label: "Plan to Watch", color: "#7A7A85" },
    dropped: { label: "Dropped", color: "#8B2635" }
  };

  var STORAGE_KEY = "ott-tracker-entries-v2";
  var entries = [];
  var activeTab = "tv"; // 'tv' | 'movies'
  var filter = "all";
  var editingId = null;
  var movieRating = 0;
  var showRating = 0;
  var formSeasons = []; // {uid, number, totalEpisodes, watchedEpisodes, upcomingDate}

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function loadEntries() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      entries = raw ? JSON.parse(raw) : [];
    } catch (e) {
      entries = [];
    }
  }
  function saveEntries() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
    } catch (e) {
      alert("Couldn't save to this browser's storage.");
    }
  }

  function escapeHtml(str) {
    var div = document.createElement("div");
    div.innerText = str == null ? "" : str;
    return div.innerHTML;
  }

  function formatDateWithDay(dateStr) {
    if (!dateStr) return "";
    var d = new Date(dateStr + "T00:00:00");
    if (isNaN(d.getTime())) return dateStr;
    return d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
  }

  /* ---------- auto-advance upcoming episodes ---------- */
  function advanceDateByCadence(dateStr, cadence) {
    var d = new Date(dateStr + "T00:00:00");
    if (cadence === "daily") d.setDate(d.getDate() + 1);
    else if (cadence === "weekly") d.setDate(d.getDate() + 7);
    else if (cadence === "biweekly") d.setDate(d.getDate() + 14);
    else if (cadence === "monthly") d.setMonth(d.getMonth() + 1);
    else return null;
    return d.toISOString().slice(0, 10);
  }

  function advanceAllSeasons() {
    var todayStr = new Date().toISOString().slice(0, 10);
    var changed = false;
    entries.forEach(function (entry) {
      if (entry.type !== "show" || !entry.seasons) return;
      entry.seasons.forEach(function (season) {
        if (!season.upcomingDate || !season.cadence || season.cadence === "none") return;
        var guard = 0;
        while (season.upcomingDate && season.upcomingDate <= todayStr && guard < 500) {
          season.totalEpisodes = String((Number(season.totalEpisodes) || 0) + 1);
          var next = advanceDateByCadence(season.upcomingDate, season.cadence);
          if (!next) break;
          season.upcomingDate = next;
          changed = true;
          guard++;
        }
      });
    });
    if (changed) saveEntries();
  }

  /* ---------- tabs ---------- */
  function renderTabs() {
    var el = document.getElementById("tabs");
    el.innerHTML =
      '<button class="tab' + (activeTab === "tv" ? " active" : "") + '" data-tab="tv">📺 TV Shows</button>' +
      '<button class="tab' + (activeTab === "movies" ? " active" : "") + '" data-tab="movies">🎬 Movies</button>';
    el.querySelectorAll(".tab").forEach(function (btn) {
      btn.addEventListener("click", function () {
        activeTab = btn.getAttribute("data-tab");
        filter = "all";
        renderAll();
      });
    });
  }

  /* ---------- filters ---------- */
  function renderFilters() {
    var el = document.getElementById("filters");
    var html = '<button class="chip' + (filter === "all" ? " active" : "") + '" data-filter="all" style="' +
      (filter === "all" ? "background:#E8B84B;color:#0E0E12;border-color:#E8B84B;" : "") + '">All</button>';
    Object.keys(STATUS).forEach(function (key) {
      if (key === "dropped") return;
      var s = STATUS[key];
      var active = filter === key;
      html += '<button class="chip' + (active ? " active" : "") + '" data-filter="' + key + '" style="' +
        (active ? "background:" + s.color + ";" : "") + '">' + s.label + "</button>";
    });
    el.innerHTML = html;
    el.querySelectorAll(".chip").forEach(function (btn) {
      btn.addEventListener("click", function () {
        filter = btn.getAttribute("data-filter");
        renderAll();
      });
    });
  }

  /* ---------- stats ---------- */
  function renderStats() {
    var stats = {
      total: entries.length,
      watching: entries.filter(function (e) { return e.status === "watching"; }).length,
      completed: entries.filter(function (e) { return e.status === "completed"; }).length,
      movies: entries.filter(function (e) { return e.type === "movie"; }).length,
      shows: entries.filter(function (e) { return e.type === "show"; }).length
    };
    document.getElementById("stats").innerHTML =
      '<div><span class="num" style="color:#E8B84B">' + stats.total + '</span> <span class="grey">total</span></div>' +
      '<div><span class="num" style="color:#2C5F5A">' + stats.watching + '</span> <span class="grey">watching</span></div>' +
      '<div><span class="num" style="color:#E8B84B">' + stats.completed + '</span> <span class="grey">completed</span></div>' +
      '<div><span class="num">' + stats.movies + '</span> <span class="grey">movies</span></div>' +
      '<div><span class="num">' + stats.shows + '</span> <span class="grey">shows</span></div>';
  }

  /* ---------- grid ---------- */
  function starsHtml(rating, size) {
    var html = "";
    for (var n = 1; n <= 5; n++) {
      html += '<span class="star' + (rating >= n ? " filled" : "") + '"' +
        (size ? ' style="font-size:' + size + 'px"' : "") + ">★</span>";
    }
    return html;
  }

  var STATUS_ORDER = { watching: 0, plan: 1, completed: 2, dropped: 3 };

  function getEffectiveStatus(entry) {
    if (entry.type === "movie") return entry.status;
    var seasons = (entry.seasons || []).filter(function (s) { return s.status !== "dropped"; });
    if (seasons.some(function (s) { return s.status === "watching"; })) return "watching";
    if (seasons.some(function (s) { return s.status === "plan"; })) return "plan";
    if (seasons.length && seasons.every(function (s) { return s.status === "completed"; })) return "completed";
    return "plan";
  }

  function entryMatchesFilter(entry, filterKey) {
    if (filterKey === "all") return true;
    if (entry.type === "movie") return entry.status === filterKey;
    return (entry.seasons || []).some(function (s) { return s.status === filterKey; });
  }

  function renderGrid() {
    var container = document.getElementById("grid-container");
    var typeForTab = activeTab === "tv" ? "show" : "movie";
    var byTab = entries.filter(function (e) {
      if (e.type !== typeForTab) return false;
      if (e.type === "movie") return e.status !== "dropped";
      return true;
    });
    var filtered = filter === "all" ? byTab : byTab.filter(function (e) { return entryMatchesFilter(e, filter); });
    filtered = filtered.slice().sort(function (a, b) {
      var sa = getEffectiveStatus(a), sb = getEffectiveStatus(b);
      var oa = STATUS_ORDER.hasOwnProperty(sa) ? STATUS_ORDER[sa] : 99;
      var ob = STATUS_ORDER.hasOwnProperty(sb) ? STATUS_ORDER[sb] : 99;
      if (oa !== ob) return oa - ob;
      var da = a.dateWatched || "";
      var db = b.dateWatched || "";
      if (da !== db) return da < db ? 1 : -1; // most recent first
      return 0;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<div class="empty"><div class="big">🎟</div><p>' +
        (byTab.length === 0
          ? "No " + (activeTab === "tv" ? "shows" : "movies") + " tracked yet. Add the first one."
          : "Nothing here for this filter.") +
        "</p></div>";
      return;
    }

    var html = "";
    var currentGroupStatus = null;
    filtered.forEach(function (entry, idx) {
      var platform = PLATFORMS.filter(function (p) { return p.name === entry.platform; })[0] || PLATFORMS[7];
      var effStatus = getEffectiveStatus(entry);
      var status = STATUS[effStatus] || STATUS.plan;

      if (effStatus !== currentGroupStatus) {
        if (currentGroupStatus !== null) html += '</div></div>'; // close previous .grid + .status-section
        var groupCount = filtered.filter(function (e) { return getEffectiveStatus(e) === effStatus; }).length;
        html += '<div class="status-section">';
        html += '<div class="status-heading"><span class="dot" style="background:' + status.color + '"></span>' + status.label + ' <span class="count">(' + groupCount + ')</span></div>';
        html += '<div class="grid">';
        currentGroupStatus = effStatus;
      }

      html += '<div class="ticket-wrap" data-status="' + effStatus + '">';
      html += '<div class="ticket">';
      html += '<div class="ticket-top">';
      html += '<span class="badge" style="background:' + platform.color + '22;color:' + platform.color + '">' + escapeHtml(entry.platform) + '</span>';
      html += '<button type="button" class="delete-corner" data-delete="' + entry.id + '" title="Delete">🗑</button>';
      html += '</div>';
      html += '<h3 class="ticket-title serif">' + escapeHtml(entry.title) + '</h3>';

      if (entry.type === "show" && entry.seasons && entry.seasons.length) {
        var totalAll = 0, watchedAll = 0;
        entry.seasons.forEach(function (s) {
          totalAll += Number(s.totalEpisodes) || 0;
          watchedAll += Number(s.watchedEpisodes) || 0;
        });
        var overallPct = totalAll ? Math.min(100, (watchedAll / totalAll) * 100) : 0;

        html += '<div class="overall-progress">';
        html += '<div class="progress-row"><span>Overall: ' + watchedAll + '/' + totalAll + ' episodes</span><span>' + Math.round(overallPct) + '%</span></div>';
        html += '<div class="progress-bar"><div class="progress-fill" style="width:' + overallPct + '%"></div></div>';
        html += '</div>';

        html += '<div class="season-list">';
        entry.seasons.forEach(function (s, sIdx) {
          var total = Number(s.totalEpisodes) || 0;
          var watched = Number(s.watchedEpisodes) || 0;
          var pct = total ? Math.min(100, (watched / total) * 100) : 0;
          var sStatus = STATUS[s.status] || STATUS.plan;
          html += '<div class="season-row">';
          html += '<div class="progress-row"><span>Season ' + escapeHtml(s.number) + ': ' + watched + '/' + total + '</span><span>' + Math.round(pct) + '%</span></div>';
          html += '<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div>';
          html += '<div class="season-counter">';
          html += '<button type="button" class="card-round-btn" data-card-ep-minus="' + entry.id + '" data-season-idx="' + sIdx + '"' + (watched <= 0 ? ' disabled' : '') + ' title="Unwatch episode">–</button>';
          html += '<span class="count-label">' + watched + (total ? ' / ' + total : '') + ' watched</span>';
          html += '<button type="button" class="card-round-btn" data-card-ep-plus="' + entry.id + '" data-season-idx="' + sIdx + '"' + (total && watched >= total ? ' disabled' : '') + ' title="Mark episode watched">+</button>';
          html += '<span class="badge" style="background:' + sStatus.color + '22;color:' + sStatus.color + ';margin-left:auto;">' + sStatus.label + '</span>';
          html += '</div>';
          if (s.upcomingDate) {
            var cadenceLabels = { daily: "daily", weekly: "weekly", biweekly: "every 2 wks", monthly: "monthly" };
            var cadTag = s.cadence && cadenceLabels[s.cadence] ? " (" + cadenceLabels[s.cadence] + ")" : "";
            html += '<div class="season-next">Next: ' + formatDateWithDay(s.upcomingDate) + cadTag + '</div>';
          }
          html += '</div>';
        });
        html += '</div>';
      }

      html += '<div class="stars">' + starsHtml(entry.rating) + '</div>';
      if (entry.notes) {
        html += '<p class="notes">' + escapeHtml(entry.notes) + '</p>';
      }
      html += '<div class="card-footer">';
      if (entry.type === "movie") {
        html += '<span class="badge" style="background:' + status.color + '22;color:' + status.color + '">' + status.label + '</span>';
      } else {
        html += '<span></span>';
      }
      html += '<button type="button" class="link-btn" data-edit="' + entry.id + '">Edit</button>';
      html += '</div>';
      if (entry.dateWatched) {
        html += '<div class="date-tag" style="margin-top:8px;">Started ' + escapeHtml(entry.dateWatched) + '</div>';
      }
      html += '</div>'; // close .ticket
      html += '</div>'; // close .ticket-wrap
    });
    html += '</div></div>'; // close last .grid + .status-section
    container.innerHTML = html;
    applyStubScaling();

    container.querySelectorAll("[data-edit]").forEach(function (btn) {
      btn.addEventListener("click", function () { openModal(btn.getAttribute("data-edit")); });
    });
    container.querySelectorAll("[data-delete]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-delete");
        if (!confirm("Delete this entry?")) return;
        entries = entries.filter(function (e) { return e.id !== id; });
        saveEntries();
        renderAll();
      });
    });
    container.querySelectorAll("[data-card-ep-plus]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        adjustSeasonWatched(btn.getAttribute("data-card-ep-plus"), Number(btn.getAttribute("data-season-idx")), 1);
      });
    });
    container.querySelectorAll("[data-card-ep-minus]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        adjustSeasonWatched(btn.getAttribute("data-card-ep-minus"), Number(btn.getAttribute("data-season-idx")), -1);
      });
    });
  }

  function maybeAutoComplete(season) {
    var total = Number(season.totalEpisodes) || 0;
    var watched = Number(season.watchedEpisodes) || 0;
    if ((!season.cadence || season.cadence === "none") && total > 0 && watched >= total) {
      season.status = "completed";
    }
  }

  function maybeAutoStart(season, prevWatched, nextWatched) {
    if (prevWatched === 0 && nextWatched > 0 && season.status !== "completed" && season.status !== "dropped") {
      if (season.status !== "watching") {
        season.prevStatus = season.status;
      }
      season.status = "watching";
    }
  }

  function maybeAutoRevert(season, prevWatched, nextWatched) {
    if (nextWatched === 0 && prevWatched > 0 && season.status === "watching" && season.prevStatus) {
      season.status = season.prevStatus;
      delete season.prevStatus;
    }
  }

  function adjustSeasonWatched(entryId, seasonIdx, delta) {
    var entry = entries.filter(function (e) { return e.id === entryId; })[0];
    if (!entry || !entry.seasons || !entry.seasons[seasonIdx]) return;
    var season = entry.seasons[seasonIdx];
    var total = Number(season.totalEpisodes) || 0;
    var current = Number(season.watchedEpisodes) || 0;
    var next = current + delta;
    if (next < 0) next = 0;
    if (total && next > total) next = total;
    season.watchedEpisodes = String(next);
    maybeAutoStart(season, current, next);
    maybeAutoRevert(season, current, next);
    maybeAutoComplete(season);
    saveEntries();
    renderGrid();
  }

  var STATUS_SCALE = {
    watching: 1,
    completed: 0.5,
    dropped: 0.25,
    plan: 0.75
  };

  function applyStubScaling() {
    document.querySelectorAll(".ticket-wrap").forEach(function (wrap) {
      var status = wrap.getAttribute("data-status");
      var scale = STATUS_SCALE.hasOwnProperty(status) ? STATUS_SCALE[status] : 1;
      var ticket = wrap.querySelector(".ticket");
      if (!ticket) return;
      ticket.style.transform = "none";
      var naturalWidth = ticket.offsetWidth;
      var naturalHeight = ticket.offsetHeight;
      wrap.style.width = (naturalWidth * scale) + "px";
      wrap.style.height = (naturalHeight * scale) + "px";
      ticket.style.transformOrigin = "top left";
      ticket.style.transform = "scale(" + scale + ")";
    });
  }

  function renderAll() {
    renderTabs();
    renderFilters();
    renderStats();
    renderGrid();
  }

  /* ---------- modal: seasons editor ---------- */
  function renderSeasonsList() {
    var el = document.getElementById("seasons-list");
    if (formSeasons.length === 0) {
      el.innerHTML = '<p style="font-size:12px;color:#7A7A85;margin:0 0 4px;">No seasons added yet.</p>';
      return;
    }
    var html = "";
    formSeasons.forEach(function (s, idx) {
      html += '<div class="season-block" data-suid="' + s.uid + '">';
      html += '<div class="season-block-header"><b>Season</b><button type="button" class="remove-season-btn" data-remove-season="' + s.uid + '">Remove</button></div>';
      html += '<label>Season number</label>';
      html += '<input type="text" data-field="number" data-suid="' + s.uid + '" value="' + escapeHtml(s.number) + '" placeholder="e.g. 1" />';
      html += '<label>Status</label>';
      html += '<select data-field="status" data-suid="' + s.uid + '">';
      Object.keys(STATUS).forEach(function (key) {
        html += '<option value="' + key + '"' + (s.status === key ? " selected" : "") + '>' + STATUS[key].label + '</option>';
      });
      html += '</select>';
      html += '<label>Total episodes</label>';
      html += '<input type="number" min="0" data-field="totalEpisodes" data-suid="' + s.uid + '" value="' + escapeHtml(s.totalEpisodes) + '" placeholder="e.g. 10" />';
      html += '<label>Episodes watched</label>';
      html += '<div class="ep-counter">';
      html += '<button type="button" class="round-btn" data-ep-minus="' + s.uid + '">–</button>';
      html += '<input type="number" min="0" data-field="watchedEpisodes" data-suid="' + s.uid + '" value="' + escapeHtml(s.watchedEpisodes) + '" />';
      html += '<button type="button" class="round-btn" data-ep-plus="' + s.uid + '">+</button>';
      html += '</div>';
      html += '<label>Upcoming episode date</label>';
      html += '<input type="date" data-field="upcomingDate" data-suid="' + s.uid + '" value="' + escapeHtml(s.upcomingDate) + '" />';
      html += '<label>Release cadence</label>';
      html += '<select data-field="cadence" data-suid="' + s.uid + '">';
      ["none", "daily", "weekly", "biweekly", "monthly"].forEach(function (c) {
        var labels = { none: "One-off / not sure", daily: "Daily", weekly: "Weekly", biweekly: "Every 2 weeks", monthly: "Monthly" };
        html += '<option value="' + c + '"' + (s.cadence === c ? " selected" : "") + '>' + labels[c] + '</option>';
      });
      html += '</select>';
      html += '</div>';
    });
    el.innerHTML = html;

    el.querySelectorAll("[data-field]").forEach(function (input) {
      input.addEventListener("input", function () {
        var suid = input.getAttribute("data-suid");
        var field = input.getAttribute("data-field");
        var season = formSeasons.filter(function (s) { return s.uid === suid; })[0];
        if (season) {
          if (field === "watchedEpisodes") {
            var prev = Number(season.watchedEpisodes) || 0;
            var next = Number(input.value) || 0;
            season[field] = input.value;
            maybeAutoStart(season, prev, next);
            maybeAutoRevert(season, prev, next);
          } else {
            season[field] = input.value;
          }
          if (field === "totalEpisodes" || field === "watchedEpisodes" || field === "cadence") {
            maybeAutoComplete(season);
          }
        }
      });
    });
    el.querySelectorAll("[data-remove-season]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var suid = btn.getAttribute("data-remove-season");
        formSeasons = formSeasons.filter(function (s) { return s.uid !== suid; });
        renderSeasonsList();
      });
    });
    el.querySelectorAll("[data-ep-minus]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var suid = btn.getAttribute("data-ep-minus");
        var season = formSeasons.filter(function (s) { return s.uid === suid; })[0];
        if (season) {
          var prev = Number(season.watchedEpisodes) || 0;
          var next = Math.max(0, prev - 1);
          season.watchedEpisodes = String(next);
          maybeAutoRevert(season, prev, next);
          renderSeasonsList();
        }
      });
    });
    el.querySelectorAll("[data-ep-plus]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var suid = btn.getAttribute("data-ep-plus");
        var season = formSeasons.filter(function (s) { return s.uid === suid; })[0];
        if (season) {
          var total = Number(season.totalEpisodes);
          var prev = Number(season.watchedEpisodes) || 0;
          var next = prev + 1;
          season.watchedEpisodes = String(total ? Math.min(total, next) : next);
          maybeAutoStart(season, prev, Number(season.watchedEpisodes));
          maybeAutoComplete(season);
          renderSeasonsList();
        }
      });
    });
  }

  function addSeason() {
    var nextNumber = formSeasons.length + 1;
    formSeasons.push({ uid: uid(), number: String(nextNumber), status: "watching", totalEpisodes: "", watchedEpisodes: "", upcomingDate: "", cadence: "weekly" });
    renderSeasonsList();
  }

  /* ---------- modal: rating ---------- */
  function renderRatingInput(containerId, current, onSet) {
    var el = document.getElementById(containerId);
    el.innerHTML = starsHtml(current, 22);
    Array.prototype.forEach.call(el.children, function (star, i) {
      star.addEventListener("click", function () { onSet(i + 1); });
    });
  }

  function populateSelects() {
    var platformSel = document.getElementById("f-platform");
    platformSel.innerHTML = PLATFORMS.map(function (p) { return '<option value="' + p.name + '">' + p.name + '</option>'; }).join("");
    var statusSel = document.getElementById("f-status");
    statusSel.innerHTML = Object.keys(STATUS).map(function (key) { return '<option value="' + key + '">' + STATUS[key].label + '</option>'; }).join("");
  }

  function renderMovieRating() {
    renderRatingInput("movie-rating-input", movieRating, function (n) {
      movieRating = movieRating === n ? 0 : n;
      renderMovieRating();
    });
  }
  function renderShowRating() {
    renderRatingInput("show-rating-input", showRating, function (n) {
      showRating = showRating === n ? 0 : n;
      renderShowRating();
    });
  }

  /* ---------- modal open/close/submit ---------- */
  function openModal(id) {
    editingId = id || null;
    var entry = id ? entries.filter(function (e) { return e.id === id; })[0] : null;
    var kind = entry ? entry.type : (activeTab === "tv" ? "show" : "movie");

    document.getElementById("modal-title").innerText = entry ? "Edit stub" : "New stub";
    document.getElementById("modal-kind").innerText = kind === "show" ? "TV Show" : "Movie";
    document.getElementById("submit-btn").innerText = entry ? "Save changes" : "Add to watchlist";

    document.getElementById("f-title").value = entry ? entry.title : "";
    document.getElementById("f-platform").value = entry ? entry.platform : "Netflix";
    document.getElementById("f-status").value = entry ? entry.status : "watching";
    document.getElementById("f-date-watched").value = entry ? (entry.dateWatched || "") : new Date().toISOString().slice(0, 10);
    document.getElementById("f-notes").value = entry ? (entry.notes || "") : "";

    document.getElementById("movie-fields").classList.toggle("hidden", kind !== "movie");
    document.getElementById("show-fields").classList.toggle("hidden", kind !== "show");
    document.getElementById("entry-form").setAttribute("data-kind", kind);

    if (kind === "movie") {
      movieRating = entry ? (entry.rating || 0) : 0;
      renderMovieRating();
    } else {
      showRating = entry ? (entry.rating || 0) : 0;
      formSeasons = entry && entry.seasons ? entry.seasons.map(function (s) {
        return { uid: uid(), number: s.number, status: s.status || "watching", prevStatus: s.prevStatus, totalEpisodes: s.totalEpisodes, watchedEpisodes: s.watchedEpisodes, upcomingDate: s.upcomingDate, cadence: s.cadence || "none" };
      }) : [];
      if (formSeasons.length === 0) addSeason();
      renderSeasonsList();
      renderShowRating();
    }

    document.getElementById("modal-overlay").classList.add("open");
  }

  function closeModal() {
    document.getElementById("modal-overlay").classList.remove("open");
    editingId = null;
  }

  function submitForm(e) {
    e.preventDefault();
    var title = document.getElementById("f-title").value.trim();
    if (!title) return;
    var kind = document.getElementById("entry-form").getAttribute("data-kind");

    var data = {
      id: editingId || uid(),
      type: kind,
      title: title,
      platform: document.getElementById("f-platform").value,
      dateWatched: document.getElementById("f-date-watched").value,
      notes: document.getElementById("f-notes").value
    };

    if (kind === "movie") {
      data.status = document.getElementById("f-status").value;
      data.rating = movieRating;

      if (data.status === "dropped") {
        // Dropped movies aren't kept — delete outright instead of saving.
        if (editingId) {
          entries = entries.filter(function (e2) { return e2.id !== editingId; });
          saveEntries();
        }
        closeModal();
        renderAll();
        return;
      }
    } else {
      data.rating = showRating;
      // Any season marked "Dropped" is removed outright, not saved.
      data.seasons = formSeasons
        .filter(function (s) { return s.status !== "dropped"; })
        .map(function (s) {
          return {
            number: s.number,
            status: s.status || "watching",
            prevStatus: s.prevStatus,
            totalEpisodes: s.totalEpisodes,
            watchedEpisodes: s.watchedEpisodes,
            upcomingDate: s.upcomingDate,
            cadence: s.cadence || "none"
          };
        });
    }

    if (editingId) {
      entries = entries.map(function (e2) { return e2.id === editingId ? data : e2; });
    } else {
      entries.unshift(data);
    }
    saveEntries();
    closeModal();
    renderAll();
  }

  /* ---------- init ---------- */
  document.addEventListener("DOMContentLoaded", function () {
    loadEntries();
    advanceAllSeasons();
    populateSelects();
    renderAll();

    document.getElementById("add-btn").addEventListener("click", function () { openModal(null); });
    document.getElementById("close-modal").addEventListener("click", closeModal);
    document.getElementById("modal-overlay").addEventListener("click", function (e) { if (e.target === this) closeModal(); });
    document.getElementById("entry-form").addEventListener("submit", submitForm);
    document.getElementById("add-season-btn").addEventListener("click", addSeason);

    document.getElementById("export-btn").addEventListener("click", exportData);
    document.getElementById("import-btn").addEventListener("click", function () {
      document.getElementById("import-file-input").click();
    });
    document.getElementById("import-file-input").addEventListener("change", importData);

    var resizeTimer;
    window.addEventListener("resize", function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(applyStubScaling, 150);
    });
  });

  /* ---------- export / import (manual cross-device sync) ---------- */
  function exportData() {
    var payload = {
      exportedAt: new Date().toISOString(),
      entries: entries
    };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    var stamp = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = "watchlist-backup-" + stamp + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function importData(e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function (evt) {
      try {
        var parsed = JSON.parse(evt.target.result);
        var incoming = Array.isArray(parsed) ? parsed : parsed.entries;
        if (!Array.isArray(incoming)) throw new Error("Not a valid backup file.");

        var mode = confirm(
          "Import " + incoming.length + " entries.\n\nClick OK to MERGE with your current list (recommended),\nor Cancel to REPLACE your current list entirely."
        );

        if (mode) {
          // merge: incoming entries win on id collision, keep everything else
          var existingIds = {};
          entries.forEach(function (en) { existingIds[en.id] = true; });
          var merged = entries.filter(function (en) {
            return !incoming.some(function (inc) { return inc.id === en.id; });
          });
          entries = merged.concat(incoming);
        } else {
          entries = incoming;
        }
        saveEntries();
        renderAll();
        alert("Import complete. " + entries.length + " entries total.");
      } catch (err) {
        alert("Couldn't read that file — make sure it's a JSON backup exported from this tracker.");
      }
      e.target.value = "";
    };
    reader.readAsText(file);
  }
</script>
</body>
